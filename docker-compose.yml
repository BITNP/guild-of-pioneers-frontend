services:
  frontend:
    build: .
    image: guild-frontend:latest
    container_name: guild-frontend
    networks:
      - guild_default
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  guild_default:
    external: true